# Vapor composition. Every key is required; names are case-sensitive.
domain = mac                   # mac | collocated (recognized, not implemented)
advection = maccormack   # semi_lagrangian | maccormack
dimension = 3                 # 2 | 3
fluid_solver = reflection         # simple | reflection
projection_solver = gpu_sor   # cpu_sor | gpu_sor
advection_backend = gpu       # cpu | gpu

# Shared simulation parameters.
resolution = 64
box_size = 4.0
emitter_radius = 0.08        # fraction of box size
source_strength = 4.0
buoyancy = 3.0
smoke_decay = 0.08
sor_iterations = 600
sor_omega = 1.9
max_frames = 0                # 0 runs until the window closes
